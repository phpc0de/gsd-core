name: Build and Release GSD Core Binaries

on:
  push:
    branches:
      - next
      - main
  pull_request:
    branches:
      - next
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Binaries (Ubuntu-latest - x64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # 1. 允许自动转换锁文件，解决之前 package-lock 冲突导致的中断 Bug
      - name: Install Project Dependencies
        run: bun install

      # ==========================================
      # 🛠️ 方案一：在真实的子项目目录 (gsd-core/) 下植入伪装脚本
      # 这样 Bun 在编译时，会把相对路径依赖正确打包进虚拟二进制文件系统中
      # ==========================================
      - name: Inject Missing Fix Script into Subfolder
        shell: bash
        run: |
          mkdir -p gsd-core/scripts
          echo "module.exports = function() { return { plugins: [] }; };" > gsd-core/scripts/fix-slash-commands.cjs
          echo "Fallback cjs file injected into gsd-core/scripts/"

      # ==========================================
      # 🚀 进入真正的子项目目录进行单文件编译
      # ==========================================
      - name: Compile Single-File Binary via Bun
        shell: bash
        run: |
          mkdir -p dist
          # 注意：进入 gsd-core 目录，以该目录下的入口文件进行编译
          cd gsd-core
          bun build ./src/cli.ts --compile --minify --target=bun-linux-x64 --outfile=../dist/gsd-core-linux-amd64

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gsd-core-linux-amd64
          path: dist/gsd-core-linux-amd64

  release:
    name: Create Pre-Release Assets
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next')
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten Artifacts Directory
        run: |
          mkdir -p release-assets
          find artifacts/ -type f -exec cp {} release-assets/ \;
          ls -R release-assets

      - name: Generate Custom Release Tag
        id: tag
        run: echo "release_tag=v$(date +'%Y.%m.%d')-beta-${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Publish Binaries to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: "GSD Core Experimental Build (${{ steps.tag.outputs.release_tag }})"
          body: |
            This release contains automatically compiled binaries optimized for OpenCode MCP execution.
            - Fixed the `$bunfs` missing `fix-slash-commands.cjs` runtime crash.
          draft: false
          prerelease: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
