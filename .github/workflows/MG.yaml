name: Manual Build & Release GSD Core Linux AMD64

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '请输入 GSD Core 编译版本号 (例如: v1.4.5)'
        required: true
        default: 'v1.4.5'

permissions:
  contents: write # 赋予写权限以自动创建 Release

jobs:
  build-and-release-gsd:
    name: Build GSD Core for Linux x64
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取真正的官方源码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 部署 Bun 运行与编译环境
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      # 3. 安装项目依赖
      - name: Install dependencies
        run: bun install

      # 4. 前置生产构建（编译出 dist/ 目录）
      - name: Production Build
        run: |
          if bun run | grep -q "build"; then
            bun run build
          fi

      # 5. 绕过源码路径，直接提取 package.json 中声明的官方入口并强行打包
      - name: Compile GSD Core to Single Binary
        run: |
          # 1. 尝试从 package.json 的 bin 字段提取真正的 CLI 入口文件
          if [ -f "./package.json" ]; then
            # 自动抓取 bin 定义的路径，如 "./bin/gsd" 或 "./dist/index.js"
            PACKAGE_BIN=$(bun -e "const pkg = require('./package.json'); console.log(typeof pkg.bin === 'object' ? Object.values(pkg.bin)[0] : pkg.bin || '')")
          fi
          
          # 2. 兜底策略：如果 package.json 没写，就去 bin/ 目录下找可执行文件
          ENTRY_POINT="$PACKAGE_BIN"
          if [ -z "$ENTRY_POINT" ] || [ ! -f "$ENTRY_POINT" ]; then
            if [ -f "./bin/gsd" ]; then ENTRY_POINT="./bin/gsd";
            elif [ -f "./bin/gsd.js" ]; then ENTRY_POINT="./bin/gsd.js";
            elif [ -f "./bin/index.js" ]; then ENTRY_POINT="./bin/index.js";
            elif [ -f "./dist/index.js" ]; then ENTRY_POINT="./dist/index.js";
            else ENTRY_POINT="./index.js"; fi
          fi
          
          echo "🎯 成功锁定官方核心打包入口: $ENTRY_POINT"
          
          # 3. 使用 Bun 锁死该入口，编译为纯正的 Linux AMD64 二进制单程序
          bun build $ENTRY_POINT --compile --target=bun-linux-x64 --outfile ./gsd-core-linux-amd64

      # 6. 一步到位，直接推送到 GitHub Releases 页面
      - name: Create GitHub Release and Upload Binary
        uses: softprops/action-gh-release@v2
        with:
          files: ./gsd-core-linux-amd64
          tag_name: ${{ github.event.inputs.release_tag }}
          name: GSD Core Official Release ${{ github.event.inputs.release_tag }}
          body: "Official standalone binary compiled from open-gsd/gsd-core for Linux AMD64 architecture. Zero Node.js runtime needed."
          draft: false
          prerelease: false
