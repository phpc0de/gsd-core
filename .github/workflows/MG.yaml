name: Build and Release GSD Core Binaries

on:
  push:
    branches:
      - next
      - main
  pull_request:
    branches:
      - next
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Binaries (Ubuntu-latest - x64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # 允许自动转换锁文件，避免安装挂掉
      - name: Install Project Dependencies
        run: bun install

      # ==========================================
      # 🛠️ 方案一的核心修复：解决 $bunfs 找不到 cjs 的闪退 Bug
      # ==========================================
      - name: Fix Missing Slash Commands Script Bug
        shell: bash
        run: |
          mkdir -p scripts
          if [ ! -f "scripts/fix-slash-commands.cjs" ]; then
            echo "module.exports = function() { return { plugins: [] }; };" > scripts/fix-slash-commands.cjs
            echo "Successfully generated fallback fix-slash-commands.cjs for compilation."
          fi

      # ==========================================
      # 🛠️ 修复点：严格过滤掉测试配置文件，精准定位真正的源码入口
      # ==========================================
      - name: Compile Single-File Binary via Bun
        shell: bash
        run: |
          mkdir -p dist
          
          # 自动侦测项目的真实主入口文件（严格排除测试与配置文件）
          ENTRY=""
          if [ -f "./cli.ts" ]; then
            ENTRY="./cli.ts"
          elif [ -f "./loader.ts" ]; then
            ENTRY="./loader.ts"
          elif [ -f "./src/cli.ts" ]; then
            ENTRY="./src/cli.ts"
          elif [ -f "./src/index.ts" ]; then
            ENTRY="./src/index.ts"
          elif [ -f "./src/main.ts" ]; then
            ENTRY="./src/main.ts"
          else
            # 兜底：寻找不包含 "config" 且不包含 "test" 的 ts 文件作为入口
            ENTRY=$(find . -name "*.ts" ! -name "*config.ts" ! -name "*test.ts" ! -name "*.d.ts" -not -path '*/.*' -not -path './node_modules/*' | head -n 1)
          fi
          
          if [ -z "$ENTRY" ]; then
            echo "Error: Cannot find any suitable source entry point (.ts file) for compilation!"
            exit 1
          fi
          
          echo "Found real entry point: $ENTRY, starting compilation..."
          bun build "$ENTRY" --compile --minify --target=bun-linux-x64 --outfile=dist/gsd-core-linux-amd64

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gsd-core-linux-amd64
          path: dist/gsd-core-linux-amd64

  release:
    name: Create Pre-Release Assets
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next')
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten Artifacts Directory
        run: |
          mkdir -p release-assets
          find artifacts/ -type f -exec cp {} release-assets/ \;
          ls -R release-assets

      - name: Generate Custom Release Tag
        id: tag
        run: echo "release_tag=v$(date +'%Y.%m.%d')-beta-${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Publish Binaries to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: "GSD Core Experimental Build (${{ steps.tag.outputs.release_tag }})"
          body: |
            This release contains automatically compiled binaries optimized for OpenCode MCP execution.
            - Fixed the `$bunfs` missing `fix-slash-commands.cjs` runtime crash.
          draft: false
          prerelease: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
