name: Build and Release GSD Core Binaries

on:
  push:
    branches:
      - next
      - main
  pull_request:
    branches:
      - next
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Binaries (Ubuntu-latest - x64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # 允许自动更新/转换锁文件，防止之前 package-lock 冲突导致的中断 Bug
      - name: Install Project Dependencies
        run: bun install

      # ==========================================
      # 🛠️ 方案一的核心修复：
      # 强行在编译环境的根目录下创建并硬编码该缺失文件，
      # 这样在后续编译流程进行依赖打包或 AST 分析时，它能直接内联进去。
      # ==========================================
      - name: Fix Missing Slash Commands Script Bug
        shell: bash
        run: |
          mkdir -p scripts
          echo "module.exports = function() { return { plugins: [] }; };" > scripts/fix-slash-commands.cjs
          echo "Successfully generated fallback fix-slash-commands.cjs for compilation."

      # ==========================================
      # 🚀 绕过对入口文件名的盲猜：
      # 1. 优先让项目跑它自带的生产环境编译（生成打包后的 js）
      # 2. 然后用 Bun 编译器直接对最终产物进行 Linux 单文件二进制封装
      # ==========================================
      - name: Compile Single-File Binary via Bun
        shell: bash
        run: |
          mkdir -p dist
          
          # 先执行项目原生的打包流程（通常是编译到 dist/ 或 bin/ 目录中）
          bun run build || true
          
          # 根据项目打包规范，直接对它的核心交付文件进行 Linux 编译
          # 如果原本项目编译出的是 dist/index.js，这里就直接封装它
          if [ -f "./dist/index.js" ]; then
            bun build ./dist/index.js --compile --minify --target=bun-linux-x64 --outfile=dist/gsd-core-linux-amd64
          elif [ -f "./bin/index.js" ]; then
            bun build ./bin/index.js --compile --minify --target=bun-linux-x64 --outfile=dist/gsd-core-linux-amd64
          else
            # 兜底编译：由于依赖已通过 bun install 补全，直接编译根目录主文件
            bun build ./index.js --compile --minify --target=bun-linux-x64 --outfile=dist/gsd-core-linux-amd64 || \
            bun build ./src/index.ts --compile --minify --target=bun-linux-x64 --outfile=dist/gsd-core-linux-amd64 || \
            bun build ./src/cli.ts --compile --minify --target=bun-linux-x64 --outfile=dist/gsd-core-linux-amd64
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gsd-core-linux-amd64
          path: dist/gsd-core-linux-amd64

  release:
    name: Create Pre-Release Assets
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next')
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten Artifacts Directory
        run: |
          mkdir -p release-assets
          find artifacts/ -type f -exec cp {} release-assets/ \;
          ls -R release-assets

      - name: Generate Custom Release Tag
        id: tag
        run: echo "release_tag=v$(date +'%Y.%m.%d')-beta-${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Publish Binaries to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: "GSD Core Experimental Build (${{ steps.tag.outputs.release_tag }})"
          body: |
            This release contains automatically compiled binaries optimized for OpenCode MCP execution.
            - Fixed the `$bunfs` missing `fix-slash-commands.cjs` runtime crash.
          draft: false
          prerelease: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
