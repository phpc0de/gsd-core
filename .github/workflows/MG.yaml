name: Build and Release GSD Core Binaries

on:
  push:
    branches:
      - next
      - main
  pull_request:
    branches:
      - next
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Binaries (${{ matrix.os }} - ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            target: bun-linux-x64
            binary_name: gsd-core-linux-amd64
          - os: macos-latest
            arch: arm64
            target: bun-darwin-arm64
            binary_name: gsd-core-darwin-arm64
          - os: windows-latest
            arch: x64
            target: bun-windows-x64
            binary_name: gsd-core-windows-amd64.exe

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Project Dependencies
        run: bun install --frozen-lockfile

      # ==========================================
      # 🛠️ 方案一的核心修复（已修正横线 - 与缩进）
      # ==========================================
      - name: Fix Missing Slash Commands Script Bug
        shell: bash
        run: |
          mkdir -p scripts
          if [ ! -f "scripts/fix-slash-commands.cjs" ]; then
            echo "module.exports = function() { return { plugins: [] }; };" > scripts/fix-slash-commands.cjs
            echo "Successfully generated fallback fix-slash-commands.cjs for compilation."
          fi

      - name: Compile Single-File Binary via Bun
        shell: bash
        run: |
          mkdir -p dist
          bun build ./src/index.ts --compile --minify --target=${{ matrix.target }} --outfile=dist/${{ matrix.binary_name }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: dist/${{ matrix.binary_name }}

  release:
    name: Create Pre-Release Assets
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next')
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten Artifacts Directory
        run: |
          mkdir -p release-assets
          find artifacts/ -type f -exec cp {} release-assets/ \;
          ls -R release-assets

      - name: Generate Custom Release Tag
        id: tag
        run: echo "release_tag=v$(date +'%Y.%m.%d')-beta-${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Publish Binaries to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: "GSD Core Experimental Build (${{ steps.tag.outputs.release_tag }})"
          body: |
            This release contains automatically compiled binaries optimized for OpenCode MCP execution.
            - Fixed the `$bunfs` missing `fix-slash-commands.cjs` runtime crash.
          draft: false
          prerelease: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
